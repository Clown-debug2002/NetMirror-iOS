workflows:
  ios-unsigned-build:
    name: Build Functional iOS App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Compile Swift Code and Package IPA
        script: |
          echo "Setting up app bundle structure..."
          mkdir -p build_output/Payload/NetMirror.app
          
          echo "Compiling Swift source code for iOS..."
          # Compile ViewController.swift into a real iOS executable binary using the iPhoneOS SDK
          xcrun swiftc -target arm64-apple-ios14.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -o build_output/Payload/NetMirror.app/NetMirror \
            ViewController.swift
            
          echo "Copying Info.plist..."
          cp Info.plist build_output/Payload/NetMirror.app/Info.plist
          
          echo "Signing application bundle ad-hoc..."
          codesign --force --sign - build_output/Payload/NetMirror.app
          
          echo "Packaging into .ipa file..."
          cd build_output
          zip -r NetMirror.ipa Payload
          cd ..
          
          echo "Functional IPA built successfully!"
    artifacts:
      - build_output/*.ipa