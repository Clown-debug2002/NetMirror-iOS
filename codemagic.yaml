workflows:
  ios-unsigned-build:
    name: Build Functional NetMirror App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build NetMirror App
        script: |
          echo "Setting up app directory..."
          mkdir -p build_output/Payload/NetMirror.app
          
          echo "Compiling Swift files..."
          xcrun swiftc -target arm64-apple-ios14.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework UIKit -framework WebKit -framework Foundation \
            -o build_output/Payload/NetMirror.app/NetMirror \
            ViewController.swift
            
          echo "Writing Info.plist..."
          cp Info.plist build_output/Payload/NetMirror.app/Info.plist
          
          echo "Signing app bundle..."
          codesign --force --sign - build_output/Payload/NetMirror.app
          
          echo "Zipping into IPA..."
          cd build_output
          zip -r NetMirror.ipa Payload
          cd ..
          
          echo "Build finished successfully!"
    artifacts:
      - build_output/*.ipa